[package]
name = "favicon-rustler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "favicon-rustler"
path = "src/bin/server.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = ["dep:axum", "dep:tokio", "dep:reqwest", "dep:tower", "dep:tower-http"]
cloudflare = ["dep:worker", "dep:wasm-bindgen"]

[dependencies]
url = "2.2.2"
soup = "0.5.1"
image = "0.23.14"  # Check for the latest version that might better support WASM
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Cloudflare Workers dependencies
worker = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# Standalone server dependencies
axum = { version = "0.7", features = ["macros"], optional = true }
tokio = { version = "1.37", features = ["full"], optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s" # optimize for size in release builds
lto = true
strip = true
codegen-units = 1
